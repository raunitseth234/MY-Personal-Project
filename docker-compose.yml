version: "3.9"

services:
  api:
    build: .
    container_name: rajesh_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./static:/app/static
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: rajesh_celery
    volumes:
      - ./app:/app/app
    env_file: .env
    depends_on:
      - redis
      - postgres
    command: celery -A app.core.celery_app worker --loglevel=info
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rajesh_postgres
    environment:
      POSTGRES_DB: rajesh_db
      POSTGRES_USER: rajesh_user
      POSTGRES_PASSWORD: rajesh_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rajesh_user -d rajesh_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: rajesh_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rajesh_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
